name: Desktop app

# The tray app (desktop/) for Windows, macOS and other desktops: its QML loaded
# headless (--selftest) and the backend tests on all three systems, then the
# Windows .exe (zip + installer) and the macOS .app (zip + dmg), each checked
# with its own --selftest. release.yml runs this for a tag and attaches the files.

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: The release's version (a leading "v" is dropped); names the files and the installer
        type: string
        required: true

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'desktop/**'
              - 'package/contents/tools/**'
              - 'package/contents/code/**'
              - 'package/contents/ui/shared/**'
              - 'package/contents/icons/**'
              - 'assets/icon.png'
              - 'tests/**'
              - '.github/workflows/desktop.yml'

  test:
    needs: changes
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || inputs.version != '' || needs.changes.outputs.relevant == 'true')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: install
        run: python -m pip install -r desktop/requirements.txt jsonschema

      - name: backend tests
        run: python -m unittest discover -s tests -v

      - name: tray app loads (every page, no QML warnings)
        run: python desktop/app.py --selftest

  windows:
    needs: test
    if: always() && needs.test.result == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = "$env:INPUT_VERSION".TrimStart("v")
          if (-not $version) { $version = "0.0.0-ci" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: build
        run: |
          python -m pip install -r desktop/build-requirements.txt
          python desktop/make-icons.py
          pyinstaller --noconfirm desktop/clab-widget.spec

      - name: bundled app loads
        shell: pwsh
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist/CLAB Widget/CLAB Widget.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            # No console in a windowed .exe: its output goes to tray.log.
            Get-Content "$env:USERPROFILE\.local\state\clab-widget\tray.log" -ErrorAction SilentlyContinue
            exit $p.ExitCode
          }

      - name: zip
        shell: pwsh
        run: Compress-Archive -Path "dist/CLAB Widget" -DestinationPath "clab-widget-windows-$env:VERSION.zip"

      - name: installer
        shell: pwsh
        run: desktop/build-installer.ps1 -Version $env:VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: clab-widget-windows
          path: |
            clab-widget-windows-*.zip
            CLAB-Widget-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    needs: test
    if: always() && needs.test.result == 'success'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION#v}"
          echo "VERSION=${v:-0.0.0-ci}" >> "$GITHUB_ENV"

      - name: build
        run: |
          python -m pip install -r desktop/build-requirements.txt
          python desktop/make-icons.py
          pyinstaller --noconfirm desktop/clab-widget.spec

      - name: bundled app loads
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: '"dist/CLAB Widget.app/Contents/MacOS/CLAB Widget" --selftest || { cat ~/.local/state/clab-widget/tray.log 2>/dev/null; exit 1; }'

      # Ad-hoc signed (PyInstaller does that); not notarized.
      - name: zip + dmg
        run: |
          ditto -c -k --keepParent "dist/CLAB Widget.app" "clab-widget-macos-$VERSION.zip"
          hdiutil create -volname "CLAB Widget" -srcfolder "dist/CLAB Widget.app" -ov -format UDZO "clab-widget-macos-$VERSION.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: clab-widget-macos
          path: |
            clab-widget-macos-*.zip
            clab-widget-macos-*.dmg
          if-no-files-found: error
          retention-days: 14

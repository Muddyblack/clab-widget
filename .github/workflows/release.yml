name: Release

on:
  # Merging a release PR (scripts/tag.sh / make tag) bumps the version in
  # package/metadata.json on main. That push is the release: the tag does not exist yet,
  # this workflow creates it together with the GitHub release.
  push:
    branches: [main]
    paths: [package/metadata.json]
  workflow_dispatch:

# One release at a time, and never cancel a half-published one.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Reads the version from package/metadata.json and works out whether it still needs a
  # release. Pushes that touch the file without bumping the version (or that
  # re-run an already released one) stop here.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version and whether it is released
        id: v
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          VERSION="$(jq -r .KPlugin.Version package/metadata.json)"
          TAG="v${VERSION}"
          NEW=true
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::notice::Releases are only cut from $DEFAULT_BRANCH."
            NEW=false
          elif git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::notice::${TAG} is already released."
            NEW=false
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "new=$NEW"
          } >> "$GITHUB_OUTPUT"

  # The .plasmoid release goes out on its own, so a broken desktop build cannot
  # hold it back; the Windows / macOS files are attached once they have passed.
  release:
    needs: prepare
    if: needs.prepare.outputs.new == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build .plasmoid
        run: make pack

      - name: Get version and artifact path
        id: info
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          NAME="$(basename "$PWD")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact=${NAME}-${VERSION}.plasmoid" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG="$(git tag --sort=-creatordate | grep -E '^v' | sed -n '1p')"
          if [ -n "$PREV_TAG" ]; then
            NOTES="$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s' --no-merges)"
          else
            NOTES="$(git log --pretty=format:'- %s' --no-merges)"
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.info.outputs.version }}
          prerelease: ${{ contains(steps.info.outputs.version, '-') }}
          body: |
            ## Changes
            ${{ steps.notes.outputs.notes }}

            ---
            **KDE Plasma:** download the `.plasmoid` and run
            ```
            kpackagetool6 -t Plasma/Applet -i ${{ steps.info.outputs.artifact }}
            ```
            then add *CLAB Widget* to your desktop, a panel, or the system tray. NixOS: use the flake's `nixosModules.default`.

            **Hyprland / Quickshell:** `nix run github:Muddyblack/clab-widget#view-hyprland`, or clone and run `qs -p .`.

            **Windows:** run `CLAB-Widget-Setup-${{ steps.info.outputs.version }}.exe` (no admin rights), or unzip `clab-widget-windows-${{ steps.info.outputs.version }}.zip` and run `CLAB Widget.exe`. It lives in the tray; add your lab server under *remote hosts*.

            **macOS:** open `clab-widget-macos-${{ steps.info.outputs.version }}.dmg` and drag *CLAB Widget* to Applications. It lives in the menu bar. Ad-hoc signed, not notarized: if macOS blocks it, use System Settings → Privacy & Security → Open Anyway.

            The Windows and macOS files are attached a few minutes after the release appears, once their builds have passed.
          files: |
            ${{ steps.info.outputs.artifact }}

  desktop:
    uses: ./.github/workflows/desktop.yml
    needs: prepare
    if: needs.prepare.outputs.new == 'true'
    with:
      version: ${{ needs.prepare.outputs.tag }}

  desktop-assets:
    needs: [prepare, release, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: clab-widget-*
          merge-multiple: true

      - name: Attach the Windows and macOS builds to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            clab-widget-windows-*.zip
            CLAB-Widget-Setup-*.exe
            clab-widget-macos-*.zip
            clab-widget-macos-*.dmg

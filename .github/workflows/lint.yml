name: Lint

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  # Which of the jobs below this diff needs: a docs-only PR pays for nothing.
  changes:
    runs-on: ubuntu-latest
    outputs:
      qml: ${{ steps.filter.outputs.qml }}
      backend: ${{ steps.filter.outputs.backend }}
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            qml:
              - 'package/contents/**/*.qml'
              - 'package/contents/**/*.js'
              - 'package/metadata.json'
              - 'hyprland/**'
              - 'desktop/**/*.qml'
              - 'shell.qml'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/workflows/lint.yml'
            backend:
              - 'package/contents/tools/**'
              - 'package/contents/code/**'
              - 'desktop/**/*.py'
              - 'tools/**'
              - 'tests/**'
              - 'docs/snapshot.schema.json'
              - 'pyproject.toml'
              - '.github/workflows/lint.yml'
            nix:
              - 'flake.nix'
              - 'flake.lock'
              - 'nix/**'
              - 'package/**'
              - 'tests/**'
              - 'docs/**'

  qml:
    needs: changes
    if: needs.changes.outputs.qml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27

      # GlassCard + card/ are copied from Glassy System Monitor and formatted there.
      - name: qmlformat check
        run: |
          nix develop --command bash -c '
            find package/contents hyprland desktop -name "*.qml" -not -path "*/card/*" -not -name GlassCard.qml \
              | xargs qmlformat --dry-run 2>&1 | grep -q "would reformat" \
              && { echo "QML needs formatting: make format"; exit 1; } || true'

      - name: Icons.js in sync with the Lucide SVGs
        run: |
          python3 tools/lucide-to-js.py
          git diff --exit-code -- package/contents/code/Icons.js

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ruff check
        uses: astral-sh/ruff-action@v3
        with:
          args: "check ."

      - name: ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check ."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # jsonschema: the Schema tests validate snapshots against docs/.
      - name: backend + schema tests
        run: |
          python -m pip install jsonschema
          python -m unittest discover -s tests -v

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: shared QML logic tests
        run: node tests/labs.test.js

  # The same suites through Nix, plus the package / NixOS module evaluating.
  flake:
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27

      - name: nix flake check
        run: nix flake check -L

      - name: plasmoid package builds
        run: nix build .#default -L

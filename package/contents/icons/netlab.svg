<svg id="svg" viewBox="280 340 1520 1270" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main Ribbon: Signature deep rust-orange to golden-yellow -->
    <linearGradient id="g1" gradientUnits="userSpaceOnUse" x1="1678" y1="1099" x2="373" y2="901">
      <stop offset="0" stop-color="#d26400"/>
      <stop offset="1" stop-color="#ff9f01"/>
    </linearGradient>
    <!-- Secondary Ribbon: BGP Crimson-Red transitioning into warm Rust-Orange -->
    <linearGradient id="g2" gradientUnits="userSpaceOnUse" x1="1342" y1="1588" x2="858" y2="746">
      <stop offset="0" stop-color="#b21a1a"/>
      <stop offset="1" stop-color="#d26400"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .main-path {
        fill: url(#g1);
        stroke: url(#g1);
        stroke-width: 12;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
      }
      .secondary-path {
        fill: url(#g2);
        stroke: url(#g2);
        stroke-width: 12;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
      }
      .dot-ring {
        fill: none;
        stroke: #ff9f01;
        stroke-width: 4;
      }
      .dot-core {
        fill: #ffffff;
        filter: url(#glow);
      }
    </style>
  </defs>

